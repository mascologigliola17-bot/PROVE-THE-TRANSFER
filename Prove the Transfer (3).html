<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prove the Transfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: sticky top bar (logo, Upload CV) with the process navigation underneath; main journey column left, "How your profile is read" panel right. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#111B2E; --muted:#58657A; --line:#D6DCE5;
  --accent:#1D4F9F; --accent-ink:#FFFFFF; --accent-soft:#E3ECFA;
  --ok:#0B7A68; --ok-soft:#DDF1EC; --part:#9A5B00; --part-soft:#FBEBD0; --none:#AE3329; --none-soft:#F9E1DE;
  --f-sans:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --surface:#131C30; --surface2:#182339; --ink:#E6EBF4; --muted:#94A1B8; --line:#26334D;
  --accent:#6FA2F2; --accent-ink:#0B1120; --accent-soft:#1B2C4A;
  --ok:#4CC2A9; --ok-soft:#12332E; --part:#E6A54A; --part-soft:#392A10; --none:#F08A80; --none-soft:#3B1B19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#131C30; --surface2:#182339; --ink:#E6EBF4; --muted:#94A1B8; --line:#26334D;
  --accent:#6FA2F2; --accent-ink:#0B1120; --accent-soft:#1B2C4A;
  --ok:#4CC2A9; --ok-soft:#12332E; --part:#E6A54A; --part-soft:#392A10; --none:#F08A80; --none-soft:#3B1B19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-sans);padding-inline:0;padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;min-width:0}
.logo svg{flex:none;color:var(--accent)}
.logo b{font:600 14px var(--f-sans);letter-spacing:.08em;text-transform:uppercase;line-height:1.1;white-space:nowrap}
.logo small{display:block;font:400 11px var(--f-sans);letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:6px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.lg{padding:13px 24px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.proc{display:flex;gap:2px;overflow-x:auto;padding-block:8px;border-top:1px solid var(--line)}
.proc button{border:0;background:none;padding:6px 14px;border-radius:99px;color:var(--muted);white-space:nowrap;font-size:13.5px;display:flex;gap:8px;align-items:center}
.proc button:not([disabled]):hover{background:var(--surface2);color:var(--ink)}
.proc button[disabled]{opacity:.5;cursor:default}
.proc button.done{color:var(--ink)}
.proc button.done::before{content:"\2713";color:var(--ok);font-size:12px}
.proc button[aria-current="step"]{background:var(--ink);color:var(--bg)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;padding-block:28px 56px;align-items:start}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
aside{position:sticky;top:130px;display:flex;flex-direction:column;gap:14px}
.read{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:2px}
.read .kicker{margin-bottom:8px}
.ri{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 8px;border-radius:8px;border:1px solid transparent}
.ri i{font:600 12px var(--f-mono);font-style:normal;color:var(--muted);padding-top:2px}
.ri b{display:block;font-size:14px}
.ri span{font-size:12.5px;color:var(--muted);line-height:1.4}
.ri.on{background:var(--accent-soft);border-color:var(--accent)}
.ri.on i{color:var(--accent)}
.ri.na b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.ri.na span{font-style:italic}
.gov{font-size:12.5px;color:var(--muted);padding:12px 14px;border:1px dashed var(--line);border-radius:8px}
.gov b{color:var(--ink);font-weight:600}
.kicker{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-size:32px;line-height:1.15;font-weight:600;margin:6px 0 0;text-wrap:balance}
h2{font-size:21px;line-height:1.25;font-weight:600;margin:4px 0 0;text-wrap:balance}
h2.caps{font-size:19px;letter-spacing:.02em;text-transform:uppercase}
h3{font-size:15px;margin:0;font-weight:600}
.lead{color:var(--muted);max-width:66ch;margin:8px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--f-mono);letter-spacing:.04em;padding:3px 9px;border-radius:99px;white-space:nowrap;text-transform:uppercase}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.part{background:var(--part-soft);color:var(--part)} .chip.none{background:var(--none-soft);color:var(--none)} .chip.info{background:var(--accent-soft);color:var(--accent)} .chip.plain{background:var(--surface2);color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:18px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tint{background:var(--surface2)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.callout{padding:13px 15px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px}
.callout.warn{border-color:var(--none);background:var(--none-soft)}
.callout.sep{border-color:var(--part);background:var(--part-soft)}
.callout b{display:block;font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
/* home */
.profile{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 16px;border-radius:10px;background:var(--surface2)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 15px var(--f-mono)}
.profile b{font-size:17px;display:block}.profile span{font-size:13.5px;color:var(--muted)}
.others{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}
.others button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px}
.others button:hover{border-color:var(--accent)}
.file{display:inline-flex;gap:8px;align-items:center;font:600 12.5px var(--f-mono);color:var(--muted)}
.upl{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.upl .ok{font:600 14px var(--f-mono);color:var(--ok);letter-spacing:.06em}
/* analysis */
.status{font:600 13px var(--f-mono);letter-spacing:.12em;color:var(--accent);min-height:20px}
.acols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.acols .card{min-height:330px}
.exps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.exps li{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);animation:rise .4s ease-out}
.exps li small{display:block;margin-top:2px;font-size:12.5px;color:var(--ok);animation:rise .4s ease-out}
.lib{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.lib li{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--muted);opacity:.5;transition:transform .25s,opacity .25s,background .25s,border-color .25s,color .25s;display:flex;justify-content:space-between;gap:8px}
.lib li.scan{opacity:1;transform:translateX(6px);border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.lib li.hit{opacity:1;color:var(--ink);border-color:var(--ok);background:var(--ok-soft)}
.lib li.hit::after{content:"\2713";color:var(--ok);font-weight:600}
.note{font-size:13px;color:var(--muted)}
.note a{color:var(--accent);font-weight:600}
.done-msg{padding:14px 16px;border-radius:8px;background:var(--ok-soft);border:1px solid var(--ok);animation:rise .4s ease-out}
.done-msg b{font:600 13px var(--f-mono);letter-spacing:.1em;display:block;color:var(--ok)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* work pattern */
.pname{padding:12px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600}
.dimgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dimgrid>div{padding:14px 16px;border-right:1px solid var(--line);border-top:1px solid var(--line)}
.dimgrid>div:nth-child(3n){border-right:0}
.dimgrid>div:nth-child(-n+3){border-top:0}
.dimgrid label,.dims label{display:block;font:600 11.5px var(--f-mono);letter-spacing:.1em;color:var(--accent);margin-bottom:3px}
.dims{display:flex;flex-direction:column}
.dims div{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.dims div:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.act{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 8px 6px 14px;font-size:13.5px}
.act button{border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%;line-height:1}
.act button:hover{background:var(--line)}
.act.off{opacity:.45;text-decoration:line-through}
.map{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.mapbox{border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:8px;min-width:0}
svg.cl{width:100%;height:auto;display:block}
.cl text{font-family:var(--f-sans);fill:var(--muted)}
.cl .node circle.base{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.cl .node circle.tint{fill:transparent}
.cl .node.sec circle.base{stroke:var(--accent);stroke-dasharray:5 4;stroke-width:1.8}
.cl .node.sec circle.tint{fill:var(--accent-soft);opacity:.45}
.cl .node.main circle.base{stroke:var(--accent);stroke-width:3}
.cl .node.main circle.tint{fill:var(--accent-soft)}
.cl .node.main text,.cl .node.sec text{fill:var(--ink)}
.cl .node.main text{font-weight:600}
.cl .edge{stroke:var(--accent);stroke-width:2.2;fill:none}
.cl .edge.dash{stroke-dasharray:6 5;stroke-width:1.6}
.cl .edge.bad{stroke:var(--none);stroke-dasharray:6 5;stroke-width:1.8}
.cl .cv rect{fill:var(--ink)} .cl .cv text{fill:var(--bg);font-weight:600;font-family:var(--f-mono)}
.cl .flag rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.cl .flag text{font-family:var(--f-mono);font-size:11.5px;fill:var(--ink)}
.cl .flag.hit rect{fill:var(--ok);stroke:var(--ok)} .cl .flag.hit text{fill:var(--surface);font-weight:600}
.cl .flag.bad rect{fill:var(--none-soft);stroke:var(--none)} .cl .flag.bad text{fill:var(--none)}
.cl .x{fill:var(--none);font:600 16px var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);padding:8px 10px 4px}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.d{border-top-style:dashed}
/* vacancy + evidence */
.vac{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:10px}
.vac b.code{font:600 18px var(--f-mono)}
.vac .t{flex:1 1 260px;min-width:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.ev{width:100%;border-collapse:collapse;font-size:13px;min-width:700px;table-layout:fixed}
table.ev th{white-space:normal;overflow-wrap:anywhere;font:600 10.5px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);text-align:left;padding:10px 12px;background:var(--surface2);}
table.ev td{padding:12px;border-top:1px solid var(--line);vertical-align:top}
table.ev td.m{color:var(--part)}
.req{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.req:first-of-type{border-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gaplist{margin:0;padding-left:18px}
.flow3{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:600 12px var(--f-mono);letter-spacing:.06em}
.flow3 span{padding:6px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.flow3 span.last{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.flow3 em{font-style:normal;color:var(--muted)}
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.course{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.course .gapt{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--part)}
.course b{font-size:16px;line-height:1.3}
.course .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.module{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.module .q{font-size:18px;font-weight:600;line-height:1.3}
/* live project */
.sched{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.sched .big{font:600 24px var(--f-mono);letter-spacing:.04em}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.tl div{padding:6px 0 6px 16px;position:relative}
.tl div::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl b{font:600 13px var(--f-mono);color:var(--accent);margin-right:8px}
.chain5{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.chain5 span{padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chain5 span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chain5 em{font-style:normal;color:var(--muted)}
.dec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dec button{padding:16px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:600 14px var(--f-mono);letter-spacing:.12em}
.dec button:hover{border-color:var(--accent);background:var(--accent-soft)}
.logrow{display:flex;flex-direction:column;gap:8px;animation:rise .4s ease-out}
.logrow .d{padding:12px 14px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.logrow .d b,.newinfo b{display:block;font:600 11.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.logrow .d.c{border-left:3px solid var(--part)}
.newinfo{padding:12px 14px;border:1px solid var(--part);background:var(--part-soft);border-radius:8px}
.newinfo b{color:var(--part)}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%;min-height:92px;resize:vertical}
.pending{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:14px 16px;border:1px dashed var(--part);border-radius:10px;background:var(--part-soft)}
.pending b{font:600 14px var(--f-mono);letter-spacing:.12em}
.verdict{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border-radius:10px;border:1px solid var(--line)}
.verdict.none{background:var(--none-soft);border-color:var(--none)}
.verdict h2{font-size:24px;margin:0}
.strip{background:var(--ink);color:var(--bg);font:600 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:6px 16px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto;padding:4px 2px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14.5px}
.msg.new{animation:rise .3s ease-out}
.msg.bot{background:var(--surface2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.chatin{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chatin input{flex:1 1 220px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
/* institutional navy treatment */
:root{--hdr:#0A2A5E;--hdr-ink:#FFFFFF;--hdr-mute:rgba(255,255,255,.72);--hdr-line:rgba(255,255,255,.2)}
.bar{background:var(--hdr);color:var(--hdr-ink);border-bottom:0}
.bar .logo svg{color:var(--hdr-ink)}
.bar .logo small{color:var(--hdr-mute)}
.bar .btn.primary{background:var(--hdr-ink);border-color:var(--hdr-ink);color:var(--hdr)}
.proc{border-top:1px solid var(--hdr-line)}
.proc button{color:var(--hdr-mute)}
.proc button:not([disabled]):hover{background:rgba(255,255,255,.12);color:var(--hdr-ink)}
.proc button.done{color:var(--hdr-ink)}
.proc button.done::before{color:#8FE0CC}
.proc button[aria-current="step"]{background:var(--hdr-ink);color:var(--hdr)}
.strip{background:#061A3D;color:#DCE6F7}
.proc button[disabled]{opacity:1;color:rgba(255,255,255,.55)}
h1,h2{letter-spacing:-.005em}
.panel,.read,.card{box-shadow:0 1px 0 rgba(10,42,94,.06)}
.samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sample{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.sample:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sample .doc{display:flex;gap:8px;align-items:center;font:600 12px var(--f-sans);color:var(--muted)}
.sample b{font-size:16px}.sample span:last-child{font-size:13px;color:var(--accent)}
@media (max-width:700px){.samples{grid-template-columns:minmax(0,1fr)}}
textarea#lptxt{width:100%;min-height:150px}
.fzq{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.fzq b{font-weight:600;font-size:14.5px}
.fz{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fz button{padding:9px 4px;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer}
.fz button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sit{border-left:3px solid var(--accent);padding:2px 0 2px 14px;font-size:14.5px}
@media (max-width:640px){.fz{grid-template-columns:1fr 1fr}}
.anc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1.5fr);gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:start}
.anc .al{display:block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
@media (max-width:640px){.anc{grid-template-columns:1fr;gap:6px}}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{position:static}

 else if(a==='startdemo'){S.lp[k].ph='run';render(true)}
 else if(a==='sendlp'){const v=($('#lptxt').value||'').trim();if(v){S.lp[k].txt=v;S.lp[k].ph='fz';render(true)}}
 else if(a==='fz'){S.lp[k].fz[+b.dataset.q]=+b.dataset.v;render(true)}
 else if(a==='lpdone'){next()}
 else if(a==='retry'){S.stage='home';render()}
});
document.addEventListener('input',e=>{if(e.target.id==='lptxt')S.lp[S.c].txt=e.target.value});
$('#home').addEventListener('click',()=>{if(S.auto)return;clearInterval(anTimer);S.stage='home';S.c=null;S.step=0;S.max=0;render()});

/* ---------- auto-play (press P for Luca then Marta, Shift+P for Marta only, Esc to stop) ---------- */
async function typeInto(txt){const t=$('#lptxt');if(!t)return;t.value='';for(const ch of txt){if(!S.auto)return;t.value+=ch;await sleep(14)}S.lp[S.c].txt=txt}
async function w(ms){const end=Date.now()+ms;while(S.auto&&Date.now()<end)await sleep(100)}
async function journey(k){
 S.stage='home';S.c=null;S.step=0;S.max=0;render();await w(k==='luca'?1200:2200);if(!S.auto)return;
 startUpload(k);await w(2000);if(!S.auto)return;
 for(const ans of D[k].chatAuto){
  await w(k==='luca'?800:1100);if(!S.auto)return;
  if(/^(Yes|No)$/.test(ans)){chatAnswer(ans);render(true)}
  else{const inp=$('#chin');for(const ch of ans){if(!S.auto)return;inp.value+=ch;await sleep(22)}await w(500);chatAnswer(ans,true);render(true)}
 }
 await w(1500);if(!S.auto)return;
 await startAnalysis();if(!S.auto)return;
 await w(2400);if(!S.auto)return;
 S.stage='app';S.step=0;S.max=0;render();await w(k==='luca'?4500:14000);if(!S.auto)return;
 next();await w(k==='luca'?7000:12000);if(!S.auto)return;
 if(skip(k)){next();await w(6000);return}
 next();await w(6500);if(!S.auto)return;
 next();await w(6500);if(!S.auto)return;
 next();await w(10000);if(!S.auto)return;
 if(noLP(k)){await w(4500);return}
 S.lp[k].ph='run';render(true);await w(3200);if(!S.auto)return;
 await w(2500);if(!S.auto)return;
 await typeInto(D[k].lp.auto);await w(1200);if(!S.auto)return;
 S.lp[k].ph='fz';render(true);await w(2500);if(!S.auto)return;
 for(let i=0;i<FQ.length;i++){S.lp[k].fz[i]=D[k].lp.fz[i];render(true);await w(1800);if(!S.auto)return}
 await w(1000);if(!S.auto)return;
 next();await w(9000);
}
async function play(all){
 if(S.auto)return;S.auto=true;
 try{for(const k of(all?['luca','marta']:['marta'])){if(!S.auto)break;await journey(k)}
  if(all&&S.auto){S.stage='end';render();await w(11000)}}
 finally{S.auto=false;render(true)}
}
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='chin'&&!S.auto){const v=e.target.value.trim();if(v){chatAnswer(v,true);render(true);const i=$('#chin');if(i)i.focus()}return}
 if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
 if(e.key==='Escape')S.auto=false;
 else if(e.key==='p'||e.key==='P')play(!e.shiftKey);
});
render();
})();
</script>
